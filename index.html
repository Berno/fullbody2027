<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#1769e0">
    <title>Full Body Tracker V7</title>
    <link rel="manifest" href="./manifest-v2.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192-v2.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512-v2.png">
    <link rel="apple-touch-icon" href="./icon-192-v2.png">
    <style>
        :root {
            --bg: #f5f6f8;
            --card: #fff;
            --line: #d9dde3;
            --text: #17191c;
            --muted: #667085;
            --accent: #1769e0;
            --danger: #b42318;
            --ok: #067647
        }

        * {
            box-sizing: border-box
        }

        html {
            -webkit-text-size-adjust: 100%
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text)
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #fff;
            border-bottom: 1px solid var(--line);
            padding-top: env(safe-area-inset-top)
        }

        .wrap {
            max-width: 980px;
            margin: auto;
            padding: 7px 9px
        }

        .topline {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap
        }

        h1 {
            font-size: 16px;
            margin: 0;
            white-space: nowrap;
            width: 100%
        }

        .selects {
            display: flex;
            gap: 5px;
            flex: 1
        }

        select,
        button,
        input,
        textarea {
            font: inherit
        }

        select,
        input,
        textarea {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff
        }

        select {
            padding: 6px 7px;
            font-size: 13px;
            min-width: 0
        }

        .selects select {
            flex: 1
        }

        .menu {
            position: relative
        }

        .menu>button {
            width: 34px;
            height: 34px;
            padding: 0;
            font-size: 18px
        }

        .menu-panel {
            display: none;
            position: absolute;
            right: 0;
            top: 38px;
            width: 200px;
            padding: 6px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .12)
        }

        .menu.open .menu-panel {
            display: grid;
            gap: 5px
        }

        button {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 8px;
            padding: 7px 9px;
            cursor: pointer
        }

        .menu-panel button {
            text-align: left;
            font-size: 13px
        }

        .primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff
        }

        .danger {
            color: var(--danger)
        }

        .status {
            font-size: 10px;
            color: var(--ok);
            margin-top: 3px
        }

        .day-title {
            font-size: 17px;
            margin: 10px 0 7px
        }

        .exercise {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 11px;
            margin-bottom: 9px;
            overflow: hidden
        }

        .exercise-head {
            padding: 9px 10px;
            border-bottom: 1px solid var(--line)
        }

        .exercise-name {
            font-weight: 750;
            font-size: 14px
        }

        .meta {
            font-size: 10px;
            color: var(--muted);
            margin-top: 3px
        }

        .sets {
            padding: 8px 9px 9px
        }

        .grid {
            display: grid;
            grid-template-columns: 28px repeat(3, 1fr);
            gap: 4px;
            align-items: center
        }

        .hdr {
            font-size: 9px;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase
        }

        .grid input {
            width: 100%;
            padding: 7px 4px;
            text-align: center;
            font-size: 16px
        }

        textarea {
            width: 100%;
            min-height: 40px;
            padding: 7px;
            margin-top: 7px;
            resize: vertical;
            font-size: 13px
        }


        .timer-row {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100%;
            margin-top: 2px
        }

        .timer-display {
            flex: 0 0 76px;
            min-width: 0;
            font-size: 20px;
            line-height: 32px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-align: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg)
        }

        .timer-actions {
            display: flex;
            gap: 4px;
            flex: 1;
            min-width: 0
        }

        .timer-actions button {
            flex: 1;
            min-width: 0;
            height: 32px;
            padding: 0 7px;
            font-size: 12px;
            white-space: nowrap
        }

        .timer-running {
            color: var(--accent)
        }

        @media(min-width:700px) {
            .wrap {
                padding: 9px 12px
            }

            .topline {
                gap: 8px
            }

            h1 {
                font-size: 18px
            }

            .selects {
                max-width: 340px
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="wrap">
            <div class="topline">
                <h1>Full Body V7</h1>
                <div class="selects"><select id="weekSelect" aria-label="Settimana"></select><select id="daySelect"
                        aria-label="Giorno">
                        <option value="A">Giorno A</option>
                        <option value="B">Giorno B</option>
                        <option value="C">Giorno C</option>
                    </select></div>
                <div class="menu" id="menu"><button id="menuToggle" aria-label="Menu">⋮</button>
                    <div class="menu-panel"><button class="primary" id="exportJson">Backup JSON</button><button
                            id="copySummary">Copia per ChatGPT</button><button id="exportCsv">Esporta
                            CSV</button><button id="importBtn">Ripristina backup</button><button class="danger"
                            id="resetWeek">Azzera settimana</button></div>
                </div>
            </div>
            <div class="timer-row" aria-label="Timer recupero">
                <div class="timer-display" id="timerDisplay" aria-live="polite">00:00</div>
                <div class="timer-actions">
                    <button type="button" class="primary" id="timerStart">Avvia</button>
                    <button type="button" id="timerStop">Stop</button>
                    <button type="button" id="timerReset">Reset</button>
                </div>
            </div>
            <div class="status" id="status">Pronto</div>
        </div>
    </header>
    <main class="wrap">
        <h2 class="day-title" id="currentDayTitle"></h2>
        <div id="exerciseList"></div>
    </main>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <script>
        (function () {
            "use strict";
            var PLAN = {
                A: [
                    { exercise: "Squat / Hack squat", sets: 3, reps: "6-8", rir: "2 / 1 / 1", rest: "3-4'" },
                    { exercise: "Pulley presa larga - upper back", sets: 3, reps: "8-10", rir: "2 / 1 / 0-1", rest: "3'" },
                    { exercise: "Military / Shoulder press", sets: 3, reps: "6-8", rir: "2 / 1 / 0-1", rest: "3'" },
                    { exercise: "Chest press", sets: 3, reps: "8-10", rir: "1 / 1 / 0-1", rest: "3'" },
                    { exercise: "Leg curl seduto", sets: 3, reps: "8-10", rir: "1 / 0-1 / 0", rest: "2-3'" },
                    { exercise: "Preacher / Panca Scott curl", sets: 3, reps: "8-10", rir: "1 / 1 / 0", rest: "2'" },
                    { exercise: "Overhead triceps extension", sets: 3, reps: "8-10", rir: "1 / 1 / 0", rest: "2'" },
                    { exercise: "Calf raise", sets: 3, reps: "8-10", rir: "1 / 0 / 0*", rest: "2'" }],
                B: [
                    { exercise: "Lat machine presa medio-larga", sets: 3, reps: "6-8", rir: "2 / 1 / 0-1", rest: "3'" },
                    { exercise: "Hip thrust", sets: 3, reps: "6-8", rir: "2 / 1 / 0-1", rest: "3-4'" },
                    { exercise: "Spinte inclinate manubri / multipower", sets: 3, reps: "8-10", rir: "1 / 1 / 0-1", rest: "3'" },
                    { exercise: "Leg extension", sets: 3, reps: "8-10", rir: "1 / 0-1 / 0", rest: "2-3'" },
                    { exercise: "Pulley in cifosi - focus grandorsale", sets: 3, reps: "8-10", rir: "1 / 1 / 0-1", rest: "2-3'" },
                    { exercise: "Alzate laterali", sets: 4, reps: "10-12", rir: "2 / 1 / 1 / 0", rest: "2'" },
                    { exercise: "Bayesian curl", sets: 2, reps: "8-10", rir: "1 / 0", rest: "2'" },
                    { exercise: "French press", sets: 2, reps: "8-10", rir: "1 / 0", rest: "2'" },
                    { exercise: "Abduzioni", sets: 3, reps: "10-12", rir: "1 / 1 / 0", rest: "2'" }],
                C: [
                    { exercise: "Panca piana", sets: 3, reps: "6-8", rir: "2 / 1 / 0-1", rest: "3-4'" },
                    { exercise: "Stacco rumeno / RDL", sets: 3, reps: "6-8", rir: "2 / 2 / 1-2 tecnico", rest: "3-4'" },
                    { exercise: "Lat machine presa stretta / supina", sets: 3, reps: "8-10", rir: "1 / 1 / 0-1", rest: "3'" },
                    { exercise: "Pressa ROM profondo", sets: 3, reps: "6-8", rir: "2 / 1 / 1", rest: "3-4'" },
                    { exercise: "Pec fly", sets: 3, reps: "8-10", rir: "1 / 1 / 0", rest: "2'" },
                    { exercise: "Deltoide posteriore al cavo", sets: 3, reps: "10-12", rir: "1 / 1 / 0", rest: "2'" },
                    { exercise: "Hammer curl", sets: 3, reps: "8-10", rir: "1 / 1 / 0", rest: "2'" },
                    { exercise: "Pushdown", sets: 3, reps: "8-10", rir: "1 / 1 / 0", rest: "2'" }]
            };
            var STORAGE_KEY = "fullBodyTrackerV7", TOTAL_WEEKS = 8, currentWeek = 1, currentDay = "A";
            var weekSelect = document.getElementById("weekSelect"), daySelect = document.getElementById("daySelect"), exerciseList = document.getElementById("exerciseList"), currentDayTitle = document.getElementById("currentDayTitle"), statusEl = document.getElementById("status"), importFile = document.getElementById("importFile"), menu = document.getElementById("menu"), timerDisplay = document.getElementById("timerDisplay"), timerStart = document.getElementById("timerStart"), timerStop = document.getElementById("timerStop"), timerReset = document.getElementById("timerReset");

            var timerElapsedMs = 0, timerStartedAt = null, timerInterval = null;

            function timerTotalMs() {
                return timerElapsedMs + (timerStartedAt !== null ? Date.now() - timerStartedAt : 0)
            }

            function formatTimer(ms) {
                var totalSeconds = Math.floor(Math.max(0, ms) / 1000);
                var minutes = Math.floor(totalSeconds / 60);
                var seconds = totalSeconds % 60;
                return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0")
            }

            function updateTimerDisplay() {
                timerDisplay.textContent = formatTimer(timerTotalMs());
                if (timerStartedAt !== null) timerDisplay.classList.add("timer-running");
                else timerDisplay.classList.remove("timer-running")
            }

            function startTimer() {
                if (timerStartedAt !== null) return;
                timerStartedAt = Date.now();
                updateTimerDisplay();
                timerInterval = setInterval(updateTimerDisplay, 250)
            }

            function stopTimer() {
                if (timerStartedAt === null) return;
                timerElapsedMs += Date.now() - timerStartedAt;
                timerStartedAt = null;
                if (timerInterval !== null) {
                    clearInterval(timerInterval);
                    timerInterval = null
                }
                updateTimerDisplay()
            }

            function resetTimer() {
                timerElapsedMs = 0;
                timerStartedAt = null;
                if (timerInterval !== null) {
                    clearInterval(timerInterval);
                    timerInterval = null
                }
                updateTimerDisplay()
            }

            function emptyStore() { return { version: 4, updatedAt: null, weeks: {} } } function loadStore() { try { var raw = localStorage.getItem(STORAGE_KEY); if (!raw) return emptyStore(); var p = JSON.parse(raw); return p && p.weeks ? p : emptyStore() } catch (e) { return emptyStore() } } var store = loadStore();
            function saveStore() { store.updatedAt = new Date().toISOString(); try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)) } catch (e) { } statusEl.textContent = "Salvato " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) }
            function ensureWeek(w) { if (!store.weeks[w]) store.weeks[w] = { A: {}, B: {}, C: {} }; if (!store.weeks[w].A) store.weeks[w].A = {}; if (!store.weeks[w].B) store.weeks[w].B = {}; if (!store.weeks[w].C) store.weeks[w].C = {}; return store.weeks[w] }
            function getExerciseData(w, d, e) { var week = ensureWeek(w); if (!week[d][e]) week[d][e] = { sets: {}, note: "" }; if (!week[d][e].sets) week[d][e].sets = {}; return week[d][e] }
            function populateWeeks() { weekSelect.innerHTML = ""; for (var i = 1; i <= TOTAL_WEEKS; i++) { var o = document.createElement("option"); o.value = String(i); o.textContent = i === 1 ? "W1 calibrazione" : "W" + i; weekSelect.appendChild(o) } weekSelect.value = String(currentWeek) }
            function makeInput(v, p, m) { var el = document.createElement("input"); el.value = v == null ? "" : v; el.placeholder = p; el.inputMode = m; el.autocomplete = "off"; return el }
            function updateSet(ei, si, key, value) { var d = getExerciseData(currentWeek, currentDay, ei); if (!d.sets[si]) d.sets[si] = {}; d.sets[si][key] = value; saveStore() }
            function renderDay() { currentDayTitle.textContent = "Giorno " + currentDay + " · Settimana " + currentWeek; exerciseList.innerHTML = ""; PLAN[currentDay].forEach(function (ex, ei) { var saved = getExerciseData(currentWeek, currentDay, ei), card = document.createElement("section"); card.className = "exercise"; var head = document.createElement("div"); head.className = "exercise-head"; var name = document.createElement("div"); name.className = "exercise-name"; name.textContent = ex.exercise; var meta = document.createElement("div"); meta.className = "meta"; meta.textContent = ex.sets + " serie · " + ex.reps + " reps · RIR " + ex.rir + " · rec. " + ex.rest; head.appendChild(name); head.appendChild(meta); card.appendChild(head); var sets = document.createElement("div"); sets.className = "sets"; var grid = document.createElement("div"); grid.className = "grid";["Set", "Peso", "Reps", "RIR"].forEach(function (t) { var h = document.createElement("div"); h.className = "hdr"; h.textContent = t; grid.appendChild(h) }); for (var si = 0; si < ex.sets; si++) { (function (setIndex) { var row = saved.sets[setIndex] || {}, lab = document.createElement("div"); lab.textContent = String(setIndex + 1); grid.appendChild(lab); var weight = makeInput(row.weight, "kg", "decimal"), reps = makeInput(row.reps, "rep", "numeric"), rir = makeInput(row.rir, "RIR", "decimal"); weight.addEventListener("input", function () { updateSet(ei, setIndex, "weight", weight.value) }); reps.addEventListener("input", function () { updateSet(ei, setIndex, "reps", reps.value) }); rir.addEventListener("input", function () { updateSet(ei, setIndex, "rir", rir.value) }); grid.appendChild(weight); grid.appendChild(reps); grid.appendChild(rir) })(si) } sets.appendChild(grid); var ta = document.createElement("textarea"); ta.placeholder = "Note opzionali..."; ta.value = saved.note || ""; ta.addEventListener("input", function () { getExerciseData(currentWeek, currentDay, ei).note = ta.value; saveStore() }); sets.appendChild(ta); card.appendChild(sets); exerciseList.appendChild(card) }) }
            function downloadFile(filename, content, mime) { var blob = new Blob([content], { type: mime }), url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url) }, 500) }
            function exportJSON() { downloadFile("full_body_v7_backup.json", JSON.stringify({ plan: PLAN, data: store }, null, 2), "application/json") }
            function esc(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"' }
            function exportCSV() { var rows = [["week", "day", "exercise", "set", "weight", "reps", "rir", "note"]]; for (var w = 1; w <= TOTAL_WEEKS; w++) { var week = store.weeks[w]; if (!week) continue;["A", "B", "C"].forEach(function (d) { PLAN[d].forEach(function (ex, ei) { var saved = week[d] && week[d][ei]; if (!saved) return; for (var si = 0; si < ex.sets; si++) { var s = saved.sets && saved.sets[si] ? saved.sets[si] : {}; if (s.weight || s.reps || s.rir || saved.note) rows.push([w, d, ex.exercise, si + 1, s.weight || "", s.reps || "", s.rir || "", saved.note || ""]) } }) }) } downloadFile("full_body_v7_progressi.csv", rows.map(function (r) { return r.map(esc).join(",") }).join("\n"), "text/csv;charset=utf-8") }
            function buildSummary() { var t = "FULL BODY V7 - PROGRESSI\n"; for (var w = 1; w <= TOTAL_WEEKS; w++) { var week = store.weeks[w]; if (!week) continue; var wt = "";["A", "B", "C"].forEach(function (d) { var lines = []; PLAN[d].forEach(function (ex, ei) { var saved = week[d] && week[d][ei]; if (!saved) return; var ss = []; for (var si = 0; si < ex.sets; si++) { var s = saved.sets && saved.sets[si] ? saved.sets[si] : {}; if (s.weight || s.reps || s.rir) ss.push("S" + (si + 1) + ": " + (s.weight || "?") + "kg x " + (s.reps || "?") + " @RIR " + (s.rir || "?")) } if (ss.length || saved.note) { var line = "- " + ex.exercise + ": " + ss.join(" | "); if (saved.note) line += " | Note: " + saved.note; lines.push(line) } }); if (lines.length) wt += "Giorno " + d + "\n" + lines.join("\n") + "\n" }); if (wt) t += "\n=== SETTIMANA " + w + " ===\n" + wt } return t }
            function copySummary() { var text = buildSummary(); if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(function () { statusEl.textContent = "Riepilogo copiato" }).catch(function () { downloadFile("full_body_v7_riepilogo.txt", text, "text/plain;charset=utf-8") }) } else downloadFile("full_body_v7_riepilogo.txt", text, "text/plain;charset=utf-8") }
            function importBackup(file) { var r = new FileReader(); r.onload = function () { try { var obj = JSON.parse(r.result), incoming = obj.data || obj; if (!incoming.weeks) throw new Error(); store = incoming; saveStore(); renderDay(); statusEl.textContent = "Backup ripristinato" } catch (e) { alert("Backup non valido") } }; r.readAsText(file) }
            weekSelect.addEventListener("change", function () { currentWeek = Number(weekSelect.value); renderDay() }); daySelect.addEventListener("change", function () { currentDay = daySelect.value; renderDay() }); document.getElementById("menuToggle").addEventListener("click", function (e) { e.stopPropagation(); menu.classList.toggle("open") }); document.addEventListener("click", function () { menu.classList.remove("open") }); document.querySelector(".menu-panel").addEventListener("click", function (e) { e.stopPropagation() }); document.getElementById("exportJson").addEventListener("click", exportJSON); document.getElementById("exportCsv").addEventListener("click", exportCSV); document.getElementById("copySummary").addEventListener("click", copySummary); document.getElementById("importBtn").addEventListener("click", function () { importFile.click() }); document.getElementById("resetWeek").addEventListener("click", function () { if (confirm("Vuoi cancellare tutti i dati della settimana " + currentWeek + "?")) { delete store.weeks[currentWeek]; saveStore(); renderDay() } }); importFile.addEventListener("change", function () { if (importFile.files && importFile.files[0]) importBackup(importFile.files[0]); importFile.value = "" }); timerStart.addEventListener("click", startTimer); timerStop.addEventListener("click", stopTimer); timerReset.addEventListener("click", resetTimer); updateTimerDisplay(); populateWeeks(); renderDay();
        })();
    </script>
</body>

</html>
