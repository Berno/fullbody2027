<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769e0"><meta name="mobile-web-app-capable" content="yes"><title>Full Body Tracker V7</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><style>
:root{--bg:#f5f6f8;--card:#fff;--line:#d9dde3;--text:#17191c;--muted:#667085;--accent:#1769e0;--danger:#b42318;--ok:#067647}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}.wrap{max-width:1000px;margin:auto;padding:14px 16px}h1{margin:0 0 10px;font-size:22px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}label{font-size:12px;color:var(--muted);font-weight:700}select,button,input,textarea{font:inherit;font-size:16px}select,input,textarea{border:1px solid var(--line);border-radius:10px;background:#fff}select{padding:10px 12px;width:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:44px}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--danger)}.status{margin-top:8px;color:var(--ok);font-size:12px}.help{font-size:12px;color:var(--muted);margin-top:4px}.day-title{margin:18px 0 10px}.day-title h2{margin:0;font-size:20px}.exercise{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}.exercise-head{padding:13px 14px;border-bottom:1px solid var(--line)}.exercise-name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}.sets{padding:11px 14px 13px}.grid{display:grid;grid-template-columns:36px repeat(3,1fr);gap:6px;align-items:center}.grid .hdr{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.grid input{width:100%;padding:10px 7px;text-align:center}.notes{margin-top:10px}.notes textarea{width:100%;min-height:54px;padding:10px;resize:vertical}.bottom-space{height:calc(24px + env(safe-area-inset-bottom))}@media(min-width:720px){.controls{display:flex;align-items:end;flex-wrap:wrap}.field{min-width:160px}.actions{display:flex;margin-top:0;margin-left:auto}}
</style></head><body><header><div class="wrap"><h1>Full Body Tracker V7</h1><div class="controls"><div class="field"><label for="weekSelect">Settimana</label><select id="weekSelect"></select></div><div class="field"><label for="daySelect">Giorno</label><select id="daySelect"><option value="A">Giorno A</option><option value="B">Giorno B</option><option value="C">Giorno C</option></select></div><div class="actions"><button class="primary" id="exportJson">Backup JSON</button><button id="copySummary">Copia per ChatGPT</button><button id="exportCsv">Esporta CSV</button><button id="importBtn">Ripristina backup</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="danger" id="resetWeek">Azzera settimana</button></div></div><div class="status" id="status">Pronto</div><div class="help">Salvataggio automatico sul dispositivo. Il backup JSON permette di ripristinare i dati anche su un altro telefono/browser.</div></div></header><main class="wrap"><div class="day-title"><h2 id="currentDayTitle"></h2></div><div id="exerciseList"></div><div class="bottom-space"></div></main><script>
"use strict";const PLAN={"A": [["Squat / Hack squat", 3, "6-8", "2 / 1 / 1", "3-4'"], ["Pulley presa larga - upper back", 3, "8-10", "2 / 1 / 0-1", "3'"], ["Military / Shoulder press", 3, "6-8", "2 / 1 / 0-1", "3'"], ["Chest press", 3, "8-10", "1 / 1 / 0-1", "3'"], ["Leg curl seduto", 3, "8-10", "1 / 0-1 / 0", "2-3'"], ["Preacher / Panca Scott curl", 3, "8-10", "1 / 1 / 0", "2'"], ["Overhead triceps extension", 3, "8-10", "1 / 1 / 0", "2'"], ["Calf raise", 3, "8-10", "1 / 0 / 0*", "2'"]], "B": [["Lat machine presa medio-larga", 3, "6-8", "2 / 1 / 0-1", "3'"], ["Hip thrust", 3, "6-8", "2 / 1 / 0-1", "3-4'"], ["Spinte inclinate manubri / multipower", 3, "8-10", "1 / 1 / 0-1", "3'"], ["Leg extension", 3, "8-10", "1 / 0-1 / 0", "2-3'"], ["Pulley in cifosi - focus grandorsale", 3, "8-10", "1 / 1 / 0-1", "2-3'"], ["Alzate laterali", 4, "10-12", "2 / 1 / 1 / 0", "2'"], ["Bayesian curl", 2, "8-10", "1 / 0", "2'"], ["French press", 2, "8-10", "1 / 0", "2'"], ["Abduzioni", 3, "10-12", "1 / 1 / 0", "2'"]], "C": [["Panca piana", 3, "6-8", "2 / 1 / 0-1", "3-4'"], ["Stacco rumeno / RDL", 3, "6-8", "2 / 2 / 1-2 tecnico", "3-4'"], ["Lat machine presa stretta / supina", 3, "8-10", "1 / 1 / 0-1", "3'"], ["Pressa ROM profondo", 3, "6-8", "2 / 1 / 1", "3-4'"], ["Pec fly", 3, "8-10", "1 / 1 / 0", "2'"], ["Deltoide posteriore al cavo", 3, "10-12", "1 / 1 / 0", "2'"], ["Hammer curl", 3, "8-10", "1 / 1 / 0", "2'"], ["Pushdown", 3, "8-10", "1 / 1 / 0", "2'"]]},STORAGE_KEY="fullBodyTrackerV7",TOTAL_WEEKS=8,$=id=>document.getElementById(id),weekSelect=$("weekSelect"),daySelect=$("daySelect"),exerciseList=$("exerciseList"),currentDayTitle=$("currentDayTitle"),statusEl=$("status"),importFile=$("importFile");let currentWeek=1,currentDay="A",store=loadStore();function emptyStore(){return{version:3,updatedAt:null,weeks:{}}}function loadStore(){try{const r=localStorage.getItem(STORAGE_KEY);if(!r)return emptyStore();const p=JSON.parse(r);return p&&p.weeks?p:emptyStore()}catch(e){return emptyStore()}}function saveStore(){store.updatedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(store));statusEl.textContent="Salvato "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}function ensureWeek(w){if(!store.weeks[w])store.weeks[w]={A:{},B:{},C:{}};for(const d of["A","B","C"])if(!store.weeks[w][d])store.weeks[w][d]={};return store.weeks[w]}function getExerciseData(w,d,e){const x=ensureWeek(w);if(!x[d][e])x[d][e]={sets:{},note:""};if(!x[d][e].sets)x[d][e].sets={};return x[d][e]}function populateWeeks(){weekSelect.innerHTML="";for(let i=1;i<=TOTAL_WEEKS;i++){const o=document.createElement("option");o.value=String(i);o.textContent=i===1?"Settimana 1 - calibrazione":"Settimana "+i;weekSelect.appendChild(o)}weekSelect.value=String(currentWeek)}function makeInput(v,p,m){const el=document.createElement("input");el.value=v??"";el.placeholder=p;el.inputMode=m;el.autocomplete="off";return el}function renderDay(){currentDayTitle.textContent=`Giorno ${currentDay} · Settimana ${currentWeek}`;exerciseList.innerHTML="";PLAN[currentDay].forEach((x,ei)=>{const [exercise,setsN,repsT,rirT,restT]=x,saved=getExerciseData(currentWeek,currentDay,ei),card=document.createElement("section");card.className="exercise";const head=document.createElement("div");head.className="exercise-head";const name=document.createElement("div");name.className="exercise-name";name.textContent=exercise;const meta=document.createElement("div");meta.className="meta";meta.textContent=`${setsN} serie · ${repsT} reps · RIR ${rirT} · recupero ${restT}`;head.append(name,meta);card.appendChild(head);const sets=document.createElement("div");sets.className="sets";const grid=document.createElement("div");grid.className="grid";["Set","Peso","Reps","RIR"].forEach(t=>{const h=document.createElement("div");h.className="hdr";h.textContent=t;grid.appendChild(h)});for(let si=0;si<setsN;si++){const s=saved.sets[si]||{},lab=document.createElement("div");lab.textContent=String(si+1);grid.appendChild(lab);const weight=makeInput(s.weight,"kg","decimal"),reps=makeInput(s.reps,"rep","numeric"),rir=makeInput(s.rir,"RIR","decimal");weight.addEventListener("input",()=>updateSet(ei,si,"weight",weight.value));reps.addEventListener("input",()=>updateSet(ei,si,"reps",reps.value));rir.addEventListener("input",()=>updateSet(ei,si,"rir",rir.value));grid.append(weight,reps,rir)}sets.appendChild(grid);const notes=document.createElement("div");notes.className="notes";const ta=document.createElement("textarea");ta.placeholder="Note opzionali...";ta.value=saved.note||"";ta.addEventListener("input",()=>{getExerciseData(currentWeek,currentDay,ei).note=ta.value;saveStore()});notes.appendChild(ta);sets.appendChild(notes);card.appendChild(sets);exerciseList.appendChild(card)})}function updateSet(ei,si,k,v){const d=getExerciseData(currentWeek,currentDay,ei);if(!d.sets[si])d.sets[si]={};d.sets[si][k]=v;saveStore()}function dl(n,c,m){const b=new Blob([c],{type:m}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),600)}function exportJSON(){dl("full_body_v7_backup.json",JSON.stringify({exportedAt:new Date().toISOString(),plan:PLAN,data:store},null,2),"application/json")}function csvEscape(v){return '"'+String(v??"").replaceAll('"','""')+'"'}function exportCSV(){const rows=[["week","day","exercise","set","weight","reps","rir","note"]];for(let w=1;w<=TOTAL_WEEKS;w++){const week=store.weeks[w];if(!week)continue;for(const d of["A","B","C"]){PLAN[d].forEach((x,ei)=>{const saved=week[d]?.[ei];if(!saved)return;for(let si=0;si<x[1];si++){const s=saved.sets?.[si]||{};if(s.weight||s.reps||s.rir||saved.note)rows.push([w,d,x[0],si+1,s.weight||"",s.reps||"",s.rir||"",saved.note||""])}})}}dl("full_body_v7_progressi.csv",rows.map(r=>r.map(csvEscape).join(",")).join("
"),"text/csv;charset=utf-8")}function buildSummary(){let t="FULL BODY V7 - PROGRESSI
Esportato: "+new Date().toLocaleString()+"
";for(let w=1;w<=TOTAL_WEEKS;w++){const week=store.weeks[w];if(!week)continue;let wt="";for(const d of["A","B","C"]){let lines=[];PLAN[d].forEach((x,ei)=>{const saved=week[d]?.[ei];if(!saved)return;let sl=[];for(let si=0;si<x[1];si++){const s=saved.sets?.[si]||{};if(s.weight||s.reps||s.rir)sl.push(`S${si+1}: ${s.weight||"?"}kg x ${s.reps||"?"} @RIR ${s.rir||"?"}`)}if(sl.length||saved.note){let line=`- ${x[0]}: ${sl.join(" | ")}`;if(saved.note)line+=` | Note: ${saved.note}`;lines.push(line)}});if(lines.length)wt+=`Giorno ${d}
${lines.join("
")}
`}if(wt)t+=`
=== SETTIMANA ${w} ===
${wt}`}return t}async function copySummary(){const text=buildSummary();try{await navigator.clipboard.writeText(text);statusEl.textContent="Riepilogo copiato"}catch(e){dl("full_body_v7_riepilogo.txt",text,"text/plain;charset=utf-8");statusEl.textContent="Riepilogo scaricato"}}async function importBackup(file){try{const obj=JSON.parse(await file.text()),incoming=obj.data||obj;if(!incoming.weeks)throw new Error("Formato non valido");store=incoming;saveStore();renderDay();statusEl.textContent="Backup ripristinato"}catch(e){alert("Impossibile importare il backup: "+e.message)}}weekSelect.addEventListener("change",()=>{currentWeek=Number(weekSelect.value);renderDay()});daySelect.addEventListener("change",()=>{currentDay=daySelect.value;renderDay()});$("exportJson").addEventListener("click",exportJSON);$("exportCsv").addEventListener("click",exportCSV);$("copySummary").addEventListener("click",copySummary);$("importBtn").addEventListener("click",()=>importFile.click());importFile.addEventListener("change",async()=>{if(importFile.files&&importFile.files[0])await importBackup(importFile.files[0]);importFile.value=""});$("resetWeek").addEventListener("click",()=>{if(confirm(`Vuoi cancellare tutti i dati della settimana ${currentWeek}?`)){delete store.weeks[currentWeek];saveStore();renderDay()}});populateWeeks();daySelect.value=currentDay;renderDay();if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script></body></html>
